on: workflow_dispatch
name: Build release apk

# Always signs with the permanent Skyfy key restored from GitHub Secrets.
# There is NO fallback to the debug key: missing secrets fail the build.
jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    env:
      # SHA-256 of the permanent Skyfy certificate (public information).
      EXPECTED_SHA256: a888b4a7122c411e8219559fe4dbaad9045ea8ac244eb833feca35eaf2750410

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17.x'

      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          missing=""
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Release signing is not configured. Missing GitHub secrets:$missing. See GITHUB-SECRETS.md."
            exit 1
          fi

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties
          if ! keytool -list -keystore android/app/key.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::The keystore could not be opened. Check KEYSTORE_BASE64, KEYSTORE_PASSWORD and KEY_ALIAS."
            exit 1
          fi

      - run: flutter pub get
      - run: flutter analyze . --no-fatal-infos

      - run: flutter build apk --release --flavor github

      - name: Verify the signing certificate
        run: |
          APK=build/app/outputs/flutter-apk/app-github-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | grep -E "certificate SHA-(1|256) digest"
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | grep "certificate SHA-256 digest" | head -1 | sed 's/.*: *//' | tr 'A-Z' 'a-z')
          if [ "$ACTUAL" != "$EXPECTED_SHA256" ]; then
            echo "::error::The APK is not signed with the permanent Skyfy key."
            exit 1
          fi

      - name: Rename apk
        run: cp build/app/outputs/flutter-apk/app-github-release.apk Skyfy.apk

      - uses: actions/upload-artifact@v5
        with:
          name: Skyfy-release
          path: Skyfy.apk

      - name: Remove signing files
        if: always()
        run: rm -f android/app/key.jks android/key.properties
